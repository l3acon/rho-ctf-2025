---
- hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.dnf:
        name: chrony
        state: latest

    - name: Ensure SELinux is set to enforcing mode
      ansible.builtin.lineinfile:
        path: /etc/chrony/chrony.conf
        regexp: '^server 3.north-america.pool.ntp.org'
        line: server 3.north-america.pool.ntp.org